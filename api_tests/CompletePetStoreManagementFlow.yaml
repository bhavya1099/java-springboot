config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 20
  payload:
    path: "CompletePetStoreManagementFlow.csv"
    fields:
      - "username"
      - "email"
      - "firstName"
      - "lastName"
      - "password"
      - "phone"
      - "petId" 
      - "orderId"
    skipHeader: true
    delimiter: "^|^"
  plugins:
    expect: {}

scenarios:
  - name: "Complete pet store management flow"
    flow: 
      - post:
          url: "/user"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json:
            username: "{{ username }}"
            email: "{{ email }}"
            firstName: "{{ firstName }}"
            lastName: "{{ lastName }}"
            password: "{{ password }}"
            phone: "{{ phone }}"
          expect:
            - statusCode: 200
            - hasProperty: 'id'
            - hasProperty: 'username'
            - hasProperty: 'firstName'
            - hasProperty: 'lastName'
            - hasProperty: 'email'
            - hasProperty: 'password'
            - hasProperty: 'phone'
            - hasProperty: 'userStatus'
        think: 1

      - get:
          url: "/user/login?username={{ username }}&password={{ password }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: 'message'
            - equals: ['message', 'User logged in successfully']
        think: 1

      - post:
          url: "/pet"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json:
            name: "Fluffy"
            category: "Cat"
            status: "available"
          expect:
            - statusCode: 200
            - hasProperty: 'id'
            - equals: ['name', 'Fluffy']
            - equals: ['status', 'available']
        think: 1

      - post:
          url: "/pet/{{ petId }}/uploadImage"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          formData:
            file: "pet.jpg"
          expect:
            - statusCode: 200
            - hasProperty: 'message'
            - equals: ['message', 'Image uploaded successfully']
        think: 1

      - put:
          url: "/pet/{{ petId }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json:
            status: "pending"
          expect:
            - statusCode: 200
            - equals: ['status', 'pending']
        think: 1

      - get:
          url: "/pet/findByStatus?status=pending"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: 'pets'
        think: 1

      - post:
          url: "/store/order"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json:
            petId: "{{ petId }}"
            quantity: 1
            shipDate: "2022-05-31"
            status: "placed"
          expect:
            - statusCode: 200
            - hasProperty: 'id'
            - equals: ['status', 'placed']
        think: 1

      - delete:
          url: "/store/order/{{ orderId }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
        think: 1

      - delete:
          url: "/pet/{{ petId }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
        think: 1

      - delete:
          url: "/user/{{ username }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
        think: 1

      - get:
          url: "/user/logout"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
        think: 1
