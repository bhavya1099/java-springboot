config:
  target: "{{ $processEnvironment.API_HOST }}"
  ensure:
    p99: 300
  plugins:
    expect: {}
  payload:
    path: "ErrorHandlingAndValidation.csv"
    fields:
      - "petId"
      - "status"
      - "tags"
      - "id"
      - "category"
      - "name"
      - "username"
      - "firstName"
      - "lastName"
      - "email"
      - "password"
      - "phone"
      - "userStatus"
      - "orderId"
    skipHeader: true
    delimiter: "|^|"
  phases:
    - duration: 60
      arrivalRate: 5
scenarios:
  - name: "Scenario: Error handling and validation"
    flow:
      - log: "Test: Creating a pet without required fields"
      - post:
          url: "/v2/pet"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 405
      - log: "Test: Finding a pet with invalid ID"
      - get:
          url: "/v2/pet/{{ petId }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 404
      - log: "Test: Fetching an order with ID less than 1"
      - get:
          url: "/v2/store/order/{{ orderId }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400
      - log: "Test: Fetching an order with ID greater than 10"
      - get:
          url: "/v2/store/order/{{ orderId }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400
      - log: "Test: Creating a user without required fields"
      - post:
          url: "/v2/user"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - hasProperty: "code"
            - hasProperty: "message"
            - hasProperty: "type"
      - log: "Test: Logging in with invalid credentials"
      - get:
          url: "/v2/user/{{ username }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400
      - log: "End of Scenario"
